aid: mangata-finance
name: Mangata Finance
description: >-
  Mangata Finance (Mangata X, since rebranded GASP) is a decentralized exchange
  built as a Substrate parachain in the Polkadot and Kusama ecosystem. It is
  designed for algorithmic traders and DeFi frontends, offering gas-free swaps,
  an omnichain ZK-rollup architecture, and a Proof-of-Liquidity consensus model
  where liquidity providers help secure the network. There is no REST or OpenAPI
  surface; developers integrate through a TypeScript SDK (@mangata-finance/sdk)
  that communicates with the Mangata Substrate node over Polkadot.js
  JSON-RPC/WebSocket, with published type-definition packages and open-source
  node, bridge, and dev-kit repositories under the gasp-xyz GitHub organization.
