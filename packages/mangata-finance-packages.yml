notes: >-
  Mangata Finance (Mangata X / GASP) is a Substrate-based parachain DEX. Its
  developer surface is a TypeScript SDK that communicates with the Mangata
  Substrate node over Polkadot.js JSON-RPC/WebSocket (there is no REST/OpenAPI
  API). Packages are published under the @mangata-finance npm scope from the
  gasp-xyz/mangata-dev-kit monorepo.
